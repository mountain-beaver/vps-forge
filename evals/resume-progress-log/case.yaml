name: resume-progress-log
expected_outcome: |
  Reads progress.log, sees that phases up to the firewall are logged as done, re-checks them (sshd -T, ufw status, the audit) before trusting the log, and continues with the first phase not done (fail2ban), instead of starting over or redoing the SSH hardening.
