name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write           # signs the provenance attestation (Sigstore)
  attestations: write
  artifact-metadata: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Tag matches plugin.json
        run: |
          v=$(python3 -c 'import json;print(json.load(open(".claude-plugin/plugin.json"))["version"])')
          [ "v$v" = "$GITHUB_REF_NAME" ] || { echo "tag $GITHUB_REF_NAME does not match plugin.json version $v"; exit 1; }
      - name: Checks
        run: sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck python3-yaml && sudo bash tests/run.sh
      - name: Build skill zip (for claude.ai upload)
        run: make package
      # SLSA build provenance for the zip and every script, so a downloaded file can be checked:
      # gh attestation verify audit.sh -R mountain-beaver/vps-forge
      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6  # v4.2.2
        with:
          subject-path: |
            dist/vps-forge-skill.zip
            skills/vps-forge/scripts/*.sh
      - name: Release notes from CHANGELOG
        run: |
          v=${GITHUB_REF_NAME#v}
          awk -v v="$v" '$0 ~ "^## "v" " {on=1; next} /^## / {on=0} on' CHANGELOG.md > notes.md
          [ -s notes.md ] || { echo "CHANGELOG.md has no section for $v"; exit 1; }
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64  # v3.0.3
        with:
          files: dist/vps-forge-skill.zip
          body_path: notes.md
