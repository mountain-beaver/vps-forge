# /etc/sysctl.d/99-vps-forge.conf: managed by vps-forge
# Apply: sysctl --system     (for sysctl.d the LAST file wins, hence 99-)

# --- Network: spoofing, redirects, floods ---
# accept_redirects, send_redirects, accept_source_route: conf.all/conf.default may leave
# interfaces that are already up (eth0, ...) unchanged. `default` only seeds interfaces created
# later, and for some keys the kernel ORs `all` with the per-interface value. They take effect
# after a reboot or a per-interface write (see references); check: sysctl net.ipv4.conf.eth0.accept_redirects
net.ipv4.tcp_syncookies = 1
# 1 = strict. Use 2 (loose) on VPN gateways, Tailscale exit nodes and multi-homed hosts.
net.ipv4.conf.all.rp_filter = 1
net.ipv4.conf.default.rp_filter = 1
net.ipv4.conf.all.accept_redirects = 0
net.ipv4.conf.default.accept_redirects = 0
net.ipv4.conf.all.secure_redirects = 0
net.ipv4.conf.default.secure_redirects = 0
net.ipv6.conf.all.accept_redirects = 0
net.ipv6.conf.default.accept_redirects = 0
# IPv6 ignores conf.all here: set every interface (systemd-sysctl expands the glob at boot and
# for interfaces that appear later)
net.ipv6.conf.*.accept_redirects = 0
net.ipv4.conf.all.send_redirects = 0
net.ipv4.conf.default.send_redirects = 0
net.ipv4.conf.all.accept_source_route = 0
net.ipv4.conf.default.accept_source_route = 0
net.ipv6.conf.all.accept_source_route = 0
net.ipv6.conf.default.accept_source_route = 0
net.ipv4.icmp_echo_ignore_broadcasts = 1
net.ipv4.icmp_ignore_bogus_error_responses = 1
# Do NOT touch net.ipv6.conf.*.accept_ra: most VPS get their IPv6 route from router advertisements.
# Do NOT set net.ipv4.ip_forward = 0 on Docker or VPN hosts. VPN gateways need it = 1 (vpn.md).

# --- Kernel information leaks / process isolation ---
kernel.kptr_restrict = 2
kernel.dmesg_restrict = 1
kernel.randomize_va_space = 2
kernel.yama.ptrace_scope = 1

# --- Filesystem race / dump protections ---
fs.protected_hardlinks = 1
fs.protected_symlinks = 1
fs.protected_fifos = 2
fs.protected_regular = 2
fs.suid_dumpable = 0

# --- Memory ---
vm.swappiness = 10

# --- Throughput: BBR congestion control (remove both lines if bbr is unavailable) ---
net.core.default_qdisc = fq
net.ipv4.tcp_congestion_control = bbr
