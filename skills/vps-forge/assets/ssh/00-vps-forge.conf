# /etc/ssh/sshd_config.d/00-vps-forge.conf: managed by vps-forge
# Named 00- on purpose: for most directives sshd uses the FIRST value it reads,
# so this must sort before cloud-init's 50-cloud-init.conf.
# Validate before applying:  sshd -t && systemctl reload ssh

# Port 22

PermitRootLogin no
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitEmptyPasswords no
PubkeyAuthentication yes
AuthenticationMethods publickey

# Only members of this group may log in (usermod -aG sshusers <user>)
AllowGroups sshusers

# Every key the client's agent offers counts; 3 locks out users with several keys loaded.
MaxAuthTries 5
MaxSessions 10
LoginGraceTime 30
ClientAliveInterval 300
ClientAliveCountMax 2

X11Forwarding no
AllowAgentForwarding no
PermitUserEnvironment no
# AllowTcpForwarding stays at its default (yes): SSH tunnels are the safe way to reach
# databases and admin UIs bound to 127.0.0.1. Set "no" if nobody needs them.
