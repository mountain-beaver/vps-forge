schema_version: "1.1"
name: narrow-ssh-port
expected_outcome: |
  Script mode for exactly what was asked: SSH on 2222 (socket activation handled on Ubuntu 24.04) and fail2ban for that port, with the admin's IP on fail2ban's ignore list before it starts and the SSH change inside a dead-man window, verified from a new connection. It does not add a firewall, change SSH crypto or turn off root login unasked; it offers those in one line.
