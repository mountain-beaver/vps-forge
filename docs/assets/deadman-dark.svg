<svg xmlns="http://www.w3.org/2000/svg" width="804" height="533" viewBox="0 0 804 533" role="img" aria-label="A bad sshd change, a refused login, and the automatic undo"><title>A bad sshd change, a refused login, and the automatic undo</title><style>text{font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace;font-size:13px;white-space:pre}@keyframes r0{0%,2.38%{opacity:0;clip-path:inset(0 100% 0 0)}2.39%{opacity:1;clip-path:inset(0 calc(100% - 125px) 0 0)}5.29%,97%{opacity:1;clip-path:inset(0 0 0 0)}100%{opacity:0}}.r0{animation:r0 25.3s steps(28) infinite}@keyframes r1{0%,6.68%{opacity:0}6.98%,97%{opacity:1}100%{opacity:0}}.r1{animation:r1 25.3s linear infinite}@keyframes r2{0%,6.68%{opacity:0}6.98%,97%{opacity:1}100%{opacity:0}}.r2{animation:r2 25.3s linear infinite}@keyframes r3{0%,6.68%{opacity:0}6.98%,97%{opacity:1}100%{opacity:0}}.r3{animation:r3 25.3s linear infinite}@keyframes r4{0%,7.67%{opacity:0}7.97%,97%{opacity:1}100%{opacity:0}}.r4{animation:r4 25.3s linear infinite}@keyframes r5{0%,9.85%{opacity:0;clip-path:inset(0 100% 0 0)}9.86%{opacity:1;clip-path:inset(0 calc(100% - 125px) 0 0)}17.35%,97%{opacity:1;clip-path:inset(0 0 0 0)}100%{opacity:0}}.r5{animation:r5 25.3s steps(72) infinite}@keyframes r6{0%,18.74%{opacity:0}19.04%,97%{opacity:1}100%{opacity:0}}.r6{animation:r6 25.3s linear infinite}@keyframes r7{0%,19.72%{opacity:0}20.02%,97%{opacity:1}100%{opacity:0}}.r7{animation:r7 25.3s linear infinite}@keyframes r8{0%,21.90%{opacity:0;clip-path:inset(0 100% 0 0)}21.91%{opacity:1;clip-path:inset(0 calc(100% - 125px) 0 0)}28.47%,97%{opacity:1;clip-path:inset(0 0 0 0)}100%{opacity:0}}.r8{animation:r8 25.3s steps(63) infinite}@keyframes r9{0%,29.85%{opacity:0}30.15%,97%{opacity:1}100%{opacity:0}}.r9{animation:r9 25.3s linear infinite}@keyframes r10{0%,30.84%{opacity:0}31.14%,97%{opacity:1}100%{opacity:0}}.r10{animation:r10 25.3s linear infinite}@keyframes r11{0%,33.02%{opacity:0;clip-path:inset(0 100% 0 0)}33.03%{opacity:1;clip-path:inset(0 calc(100% - 133px) 0 0)}36.98%,97%{opacity:1;clip-path:inset(0 0 0 0)}100%{opacity:0}}.r11{animation:r11 25.3s steps(38) infinite}@keyframes r12{0%,38.37%{opacity:0}38.67%,97%{opacity:1}100%{opacity:0}}.r12{animation:r12 25.3s linear infinite}@keyframes r13{0%,39.36%{opacity:0}39.66%,97%{opacity:1}100%{opacity:0}}.r13{animation:r13 25.3s linear infinite}@keyframes r14{0%,41.53%{opacity:0}41.83%,97%{opacity:1}100%{opacity:0}}.r14{animation:r14 25.3s linear infinite}@keyframes w14{0%,41.53%{width:0}53.41%,100%{width:314px}}.w14{animation:w14 25.3s linear infinite}@keyframes r15{0%,55.00%{opacity:0;clip-path:inset(0 100% 0 0)}55.01%{opacity:1;clip-path:inset(0 calc(100% - 125px) 0 0)}58.02%,97%{opacity:1;clip-path:inset(0 0 0 0)}100%{opacity:0}}.r15{animation:r15 25.3s steps(29) infinite}@keyframes r16{0%,59.40%{opacity:0}59.70%,97%{opacity:1}100%{opacity:0}}.r16{animation:r16 25.3s linear infinite}@keyframes r17{0%,59.40%{opacity:0}59.70%,97%{opacity:1}100%{opacity:0}}.r17{animation:r17 25.3s linear infinite}@keyframes r18{0%,59.40%{opacity:0}59.70%,97%{opacity:1}100%{opacity:0}}.r18{animation:r18 25.3s linear infinite}@keyframes r19{0%,59.40%{opacity:0}59.70%,97%{opacity:1}100%{opacity:0}}.r19{animation:r19 25.3s linear infinite}@keyframes r20{0%,61.58%{opacity:0;clip-path:inset(0 100% 0 0)}61.59%{opacity:1;clip-path:inset(0 calc(100% - 133px) 0 0)}67.73%,97%{opacity:1;clip-path:inset(0 0 0 0)}100%{opacity:0}}.r20{animation:r20 25.3s steps(59) infinite}@keyframes r21{0%,69.12%{opacity:0}69.42%,97%{opacity:1}100%{opacity:0}}.r21{animation:r21 25.3s linear infinite}@keyframes r22{0%,70.11%{opacity:0}70.41%,97%{opacity:1}100%{opacity:0}}.r22{animation:r22 25.3s linear infinite}@media (prefers-reduced-motion: reduce){*{animation:none!important;opacity:1!important;clip-path:none!important}}</style><rect x="1" y="1" width="802" height="531" rx="12" fill="#0E161E" stroke="#26333F"/><path d="M1 38 H803" stroke="#26333F"/><circle cx="32" cy="20" r="5.5" fill="#26333F"/><circle cx="50" cy="20" r="5.5" fill="#26333F"/><circle cx="68" cy="20" r="5.5" fill="#26333F"/><text x="402" y="25" fill="#8796A5" text-anchor="middle" style="font-size:12px">A bad sshd change, a refused login, and the automatic undo</text><text class="r0" x="24" y="65" xml:space="preserve"><tspan fill="#3FB683">admin@vps:~$ </tspan><tspan fill="#E4EBF1">sudo vps-forge-deadman arm 1</tspan></text><text class="r1" x="24" y="84" fill="#E4EBF1" xml:space="preserve">deadman: ARMED: rollback at 14:08:31 unless you run 'vps-forge-deadman disarm' (snapshot</text><text class="r2" x="24" y="103" fill="#E4EBF1" xml:space="preserve">  20261024-140731-9zwl; a reboot while armed also rolls back; fail2ban unban on rollback:</text><text class="r3" x="24" y="122" fill="#E4EBF1" xml:space="preserve">  127.0.0.1)</text><text class="r4" x="24" y="141" fill="#8796A5" xml:space="preserve"># one minute for the demo; the default is 5</text><text class="r5" x="24" y="160" xml:space="preserve"><tspan fill="#3FB683">admin@vps:~$ </tspan><tspan fill="#E4EBF1">echo 'AllowUsers deploy' | sudo tee /etc/ssh/sshd_config.d/50-users.conf</tspan></text><text class="r6" x="24" y="179" fill="#E4EBF1" xml:space="preserve">AllowUsers deploy</text><text class="r7" x="24" y="198" fill="#8796A5" xml:space="preserve"># the mistake: admin isn't on the list</text><text class="r8" x="24" y="217" xml:space="preserve"><tspan fill="#3FB683">admin@vps:~$ </tspan><tspan fill="#E4EBF1">sudo sshd -t &amp;&amp; sudo systemctl reload ssh &amp;&amp; echo 'sshd -t: OK'</tspan></text><text class="r9" x="24" y="236" fill="#E4EBF1" xml:space="preserve">sshd -t: OK</text><text class="r10" x="24" y="255" fill="#8796A5" xml:space="preserve"># valid config, so validation alone can't catch it</text><text class="r11" x="24" y="274" xml:space="preserve"><tspan fill="#6CA8F0">you@laptop:~$ </tspan><tspan fill="#E4EBF1">ssh -o ControlPath=none admin@vps true</tspan></text><text class="r12" x="24" y="293" fill="#E5654F" xml:space="preserve">admin@vps: Permission denied (publickey,password).</text><text class="r13" x="24" y="312" fill="#8796A5" xml:space="preserve"># a NEW connection is refused, so nobody disarms</text><g class="r14"><text x="24" y="331" fill="#8796A5">… timer running: 62 s, shortened here to 3 s</text><rect x="414" y="321" width="314" height="8" rx="4" fill="#16212C"/><rect class="w14" x="414" y="321" width="314" height="8" rx="4" fill="#8796A5"/></g><text class="r15" x="24" y="350" xml:space="preserve"><tspan fill="#3FB683">admin@vps:~$ </tspan><tspan fill="#E4EBF1">sudo vps-forge-deadman status</tspan></text><text class="r16" x="24" y="369" fill="#E4EBF1" xml:space="preserve">not armed</text><text class="r17" x="24" y="388" fill="#3FB683" xml:space="preserve">ROLLED BACK since the last arm (at 2026-10-24T14:08:31Z): changes were NOT kept</text><text class="r18" x="24" y="407" fill="#E4EBF1" xml:space="preserve">snapshots:</text><text class="r19" x="24" y="426" fill="#E4EBF1" xml:space="preserve">  20261024-140731-9zwl</text><text class="r20" x="24" y="445" xml:space="preserve"><tspan fill="#6CA8F0">you@laptop:~$ </tspan><tspan fill="#E4EBF1">ssh -o ControlPath=none admin@vps 'echo logged in as $USER'</tspan></text><text class="r21" x="24" y="464" fill="#3FB683" xml:space="preserve">logged in as admin</text><text class="r22" x="24" y="483" fill="#8796A5" xml:space="preserve"># the bad change is gone, and so is the lockout</text><text x="24" y="517" fill="#8796A5" style="font-size:11.5px">Real output: Ubuntu 24.04 container with systemd, recorded by bench/demo.py. Only the wait is shortened.</text></svg>