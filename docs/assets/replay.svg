<svg xmlns="http://www.w3.org/2000/svg" width="767" height="469" viewBox="0 0 767 469" role="img" aria-label="Replay of a real benchmark run: a fresh Debian 13 VPS, Claude Opus 5.5 with vps-forge, 10 minutes. The prompt is abridged; lines are the agent's own progress messages, cut to one line."><title>Replay of a real benchmark run: a fresh Debian 13 VPS, Claude Opus 5.5 with vps-forge, 10 minutes. The prompt is abridged; lines are the agent's own progress messages, cut to one line.</title><style>text{font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace;font-size:14px;white-space:pre}@keyframes l0{0%{opacity:1}97%{opacity:1}100%{opacity:0}}.l0{animation:l0 20.3s linear infinite}@keyframes l1{0%{opacity:1}97%{opacity:1}100%{opacity:0}}.l1{animation:l1 20.3s linear infinite}@keyframes l2{0%{opacity:1}97%{opacity:1}100%{opacity:0}}.l2{animation:l2 20.3s linear infinite}@keyframes l3{0%,5.42%{opacity:0}6.22%{opacity:1}97%{opacity:1}100%{opacity:0}}.l3{animation:l3 20.3s linear infinite}@keyframes l4{0%,10.84%{opacity:0}11.64%{opacity:1}97%{opacity:1}100%{opacity:0}}.l4{animation:l4 20.3s linear infinite}@keyframes l5{0%,16.26%{opacity:0}17.06%{opacity:1}97%{opacity:1}100%{opacity:0}}.l5{animation:l5 20.3s linear infinite}@keyframes l6{0%,21.67%{opacity:0}22.47%{opacity:1}97%{opacity:1}100%{opacity:0}}.l6{animation:l6 20.3s linear infinite}@keyframes l7{0%,27.09%{opacity:0}27.89%{opacity:1}97%{opacity:1}100%{opacity:0}}.l7{animation:l7 20.3s linear infinite}@keyframes l8{0%,32.51%{opacity:0}33.31%{opacity:1}97%{opacity:1}100%{opacity:0}}.l8{animation:l8 20.3s linear infinite}@keyframes l9{0%,37.93%{opacity:0}38.73%{opacity:1}97%{opacity:1}100%{opacity:0}}.l9{animation:l9 20.3s linear infinite}@keyframes l10{0%,43.35%{opacity:0}44.15%{opacity:1}97%{opacity:1}100%{opacity:0}}.l10{animation:l10 20.3s linear infinite}@keyframes l11{0%,48.77%{opacity:0}49.57%{opacity:1}97%{opacity:1}100%{opacity:0}}.l11{animation:l11 20.3s linear infinite}@keyframes l12{0%,54.19%{opacity:0}54.99%{opacity:1}97%{opacity:1}100%{opacity:0}}.l12{animation:l12 20.3s linear infinite}@keyframes l13{0%,59.61%{opacity:0}60.41%{opacity:1}97%{opacity:1}100%{opacity:0}}.l13{animation:l13 20.3s linear infinite}@keyframes l14{0%,65.02%{opacity:0}65.82%{opacity:1}97%{opacity:1}100%{opacity:0}}.l14{animation:l14 20.3s linear infinite}@media (prefers-reduced-motion: reduce){text{animation:none!important;opacity:1!important}}</style><rect x="1" y="1" width="765" height="467" rx="12" fill="#F3F5F7" stroke="#D3DAE1"/><path d="M1 44 H766" stroke="#D3DAE1"/><circle cx="34" cy="22" r="5.5" fill="#D3DAE1"/><circle cx="52" cy="22" r="5.5" fill="#D3DAE1"/><circle cx="70" cy="22" r="5.5" fill="#D3DAE1"/><text class="l0" x="26" y="67" xml:space="preserve"><tspan fill="#1F5FAD">❯ </tspan><tspan fill="#1F5FAD">I just bought this VPS. Turn it into a proper production server for my Docker app:</tspan></text><text class="l1" x="26" y="88" xml:space="preserve"><tspan fill="#1F5FAD">  </tspan><tspan fill="#1F5FAD">secure, daily backups to the extra volume, alerts to my phone. I'm offline, decide</tspan></text><text class="l2" x="26" y="109" xml:space="preserve"><tspan fill="#1F5FAD">  </tspan><tspan fill="#1F5FAD">yourself, but I must still be able to log in with my key.</tspan></text><text class="l3" x="26" y="151" xml:space="preserve"><tspan fill="#5E6E7E">● </tspan><tspan fill="#14202B">Debian 13, KVM, 2 vCPU/3 GB, clean box, no red flags so far.</tspan></text><text class="l4" x="26" y="172" xml:space="preserve"><tspan fill="#5E6E7E">● </tspan><tspan fill="#14202B">Baseline: 78/100, 1 FAIL (no firewall).</tspan></text><text class="l5" x="26" y="193" xml:space="preserve"><tspan fill="#5E6E7E">● </tspan><tspan fill="#14202B">Phase 1 – safety net: installing the deadman switch and etckeeper (git history …</tspan></text><text class="l6" x="26" y="214" xml:space="preserve"><tspan fill="#5E6E7E">● </tspan><tspan fill="#14202B">Phase 3 – SSH hardening, inside a 5-minute dead-man window: AllowGroups sshusers …</tspan></text><text class="l7" x="26" y="235" xml:space="preserve"><tspan fill="#5E6E7E">● </tspan><tspan fill="#14202B">Key login with sudo works through the new sshd.</tspan></text><text class="l8" x="26" y="256" xml:space="preserve"><tspan fill="#5E6E7E">● </tspan><tspan fill="#14202B">Firewall on and a fresh login still works.</tspan></text><text class="l9" x="26" y="277" xml:space="preserve"><tspan fill="#5E6E7E">● </tspan><tspan fill="#14202B">fail2ban is running, your IP is whitelisted in both jails, the filter matches …</tspan></text><text class="l10" x="26" y="298" xml:space="preserve"><tspan fill="#5E6E7E">● </tspan><tspan fill="#14202B">Port 80 open, a canary container published on 8081 is blocked from outside.</tspan></text><text class="l11" x="26" y="319" xml:space="preserve"><tspan fill="#5E6E7E">● </tspan><tspan fill="#14202B">First backup taken and a restore verified byte-for-byte (all 50 data files).</tspan></text><text class="l12" x="26" y="340" xml:space="preserve"><tspan fill="#5E6E7E">● </tspan><tspan fill="#14202B">The ntfy server accepted the messages (HTTP 200).</tspan></text><text class="l13" x="26" y="382" xml:space="preserve"><tspan fill="#1E7F5A">✓ </tspan><tspan fill="#1E7F5A">Your server is set up, and you can still log in with your key as before: ssh vps.</tspan></text><text class="l14" x="26" y="403" xml:space="preserve"><tspan fill="#1E7F5A">✓ </tspan><tspan fill="#1E7F5A">The security audit went from 78/100 (1 fail) to 100/100 (0 fails).</tspan></text><text x="26" y="433" fill="#5E6E7E" style="font-size:12px">Replay of a real benchmark run: a fresh Debian 13 VPS, Claude Opus 5.5 with vps-forge, 10 minutes.</text><text x="26" y="449" fill="#5E6E7E" style="font-size:12px">The prompt is abridged; lines are the agent's own progress messages, cut to one line.</text></svg>