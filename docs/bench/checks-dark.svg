<svg xmlns="http://www.w3.org/2000/svg" width="880" height="316" viewBox="0 0 880 316" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Pass rate per check without and with the skill"><title>Pass rate per check without and with the skill</title><rect width="100%" height="100%" fill="#0d1117"/><text x="24.0" y="28.0" font-size="16" fill="#f0f6fc" text-anchor="start" font-weight="600">Which checks pass, without vs with the skill</text><text x="24.0" y="50.0" font-size="12.5" fill="#9198a1" text-anchor="start" font-weight="400">Share of runs passing each outside-in check, all scenarios and distros</text><text x="24.0" y="68.0" font-size="12.5" fill="#9198a1" text-anchor="start" font-weight="400">Not shown: 18 checks that every run passed, with and without the skill</text><line x1="330.0" y1="86.0" x2="330.0" y2="258.0" stroke="#30363d" stroke-width="1"/><text x="330.0" y="80.0" font-size="11" fill="#9198a1" text-anchor="middle" font-weight="400">0%</text><line x1="575.0" y1="86.0" x2="575.0" y2="258.0" stroke="#30363d" stroke-width="1"/><text x="575.0" y="80.0" font-size="11" fill="#9198a1" text-anchor="middle" font-weight="400">50%</text><line x1="820.0" y1="86.0" x2="820.0" y2="258.0" stroke="#30363d" stroke-width="1"/><text x="820.0" y="80.0" font-size="11" fill="#9198a1" text-anchor="middle" font-weight="400">100%</text><text x="316.0" y="114.0" font-size="12.5" fill="#f0f6fc" text-anchor="end" font-weight="400">ssh-audit: no failures</text><line x1="362.7" y1="110.0" x2="820.0" y2="110.0" stroke="#9198a1" stroke-width="2"/><circle cx="362.7" cy="110.0" r="5" fill="#6e7681" stroke="#0d1117" stroke-width="2"/><circle cx="820.0" cy="110.0" r="6" fill="#3987e5" stroke="#0d1117" stroke-width="2"/><text x="832.0" y="114.0" font-size="11.5" fill="#9198a1" text-anchor="start" font-weight="600">+93</text><text x="316.0" y="142.0" font-size="12.5" fill="#f0f6fc" text-anchor="end" font-weight="400">SSH login triggers an alert</text><line x1="591.3" y1="138.0" x2="820.0" y2="138.0" stroke="#9198a1" stroke-width="2"/><circle cx="591.3" cy="138.0" r="5" fill="#6e7681" stroke="#0d1117" stroke-width="2"/><circle cx="820.0" cy="138.0" r="6" fill="#3987e5" stroke="#0d1117" stroke-width="2"/><text x="832.0" y="142.0" font-size="11.5" fill="#9198a1" text-anchor="start" font-weight="600">+47</text><text x="316.0" y="170.0" font-size="12.5" fill="#f0f6fc" text-anchor="end" font-weight="400">root cannot log in over SSH</text><line x1="575.0" y1="166.0" x2="795.5" y2="166.0" stroke="#9198a1" stroke-width="2"/><circle cx="575.0" cy="166.0" r="5" fill="#6e7681" stroke="#0d1117" stroke-width="2"/><circle cx="795.5" cy="166.0" r="6" fill="#3987e5" stroke="#0d1117" stroke-width="2"/><text x="807.5" y="170.0" font-size="11.5" fill="#9198a1" text-anchor="start" font-weight="600">+45</text><text x="316.0" y="198.0" font-size="12.5" fill="#f0f6fc" text-anchor="end" font-weight="400">host firewall active</text><line x1="705.7" y1="194.0" x2="820.0" y2="194.0" stroke="#9198a1" stroke-width="2"/><circle cx="705.7" cy="194.0" r="5" fill="#6e7681" stroke="#0d1117" stroke-width="2"/><circle cx="820.0" cy="194.0" r="6" fill="#3987e5" stroke="#0d1117" stroke-width="2"/><text x="832.0" y="198.0" font-size="11.5" fill="#9198a1" text-anchor="start" font-weight="600">+23</text><text x="316.0" y="226.0" font-size="12.5" fill="#f0f6fc" text-anchor="end" font-weight="400">a brute-force source gets banned</text><line x1="738.3" y1="222.0" x2="820.0" y2="222.0" stroke="#9198a1" stroke-width="2"/><circle cx="738.3" cy="222.0" r="5" fill="#6e7681" stroke="#0d1117" stroke-width="2"/><circle cx="820.0" cy="222.0" r="6" fill="#3987e5" stroke="#0d1117" stroke-width="2"/><text x="832.0" y="226.0" font-size="11.5" fill="#9198a1" text-anchor="start" font-weight="600">+17</text><text x="316.0" y="254.0" font-size="12.5" fill="#f0f6fc" text-anchor="end" font-weight="400">brute-force protection active</text><line x1="754.7" y1="250.0" x2="820.0" y2="250.0" stroke="#9198a1" stroke-width="2"/><circle cx="754.7" cy="250.0" r="5" fill="#6e7681" stroke="#0d1117" stroke-width="2"/><circle cx="820.0" cy="250.0" r="6" fill="#3987e5" stroke="#0d1117" stroke-width="2"/><text x="832.0" y="254.0" font-size="11.5" fill="#9198a1" text-anchor="start" font-weight="600">+13</text><circle cx="30.0" cy="298.0" r="5" fill="#6e7681" stroke="#0d1117" stroke-width="2"/><text x="40.0" y="302.0" font-size="12.5" fill="#9198a1" text-anchor="start" font-weight="400">without the skill</text><circle cx="174.0" cy="298.0" r="6" fill="#3987e5" stroke="#0d1117" stroke-width="2"/><text x="186.0" y="302.0" font-size="12.5" fill="#9198a1" text-anchor="start" font-weight="400">with vps-forge</text></svg>